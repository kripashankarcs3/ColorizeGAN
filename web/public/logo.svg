<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>ColorizeGAN</title>
  <!-- A print split by a before/after handle. The grey half has the same
       luminance as the amber half: the photo as the model sees it, and as it
       comes back. -->
  <style>
    .grey { fill: #8c8c8c; }
    .tone { fill: #c97a16; }
    .ink { fill: #1a1a1a; }
    @media (prefers-color-scheme: dark) {
      .grey { fill: #b6b6b6; }
      .tone { fill: #f0a83c; }
      .ink { fill: #ececec; }
    }
  </style>
  <path class="grey" d="M15 0H7a7 7 0 0 0-7 7v18a7 7 0 0 0 7 7h8v-10.08A6 6 0 1 1 15 10.08Z" />
  <path class="tone" d="M17 0h8a7 7 0 0 1 7 7v18a7 7 0 0 1-7 7h-8v-10.08A6 6 0 1 0 17 10.08Z" />
  <circle class="ink" cx="16" cy="16" r="4" />
</svg>
